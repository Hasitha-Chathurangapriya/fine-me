<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SME Shop Network">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>SME Shop Network</title>

<!-- Modern Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet & MarkerCluster CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-light: #eff6ff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --bg-input: #ffffff;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius: 16px;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
}

[data-theme="dark"] {
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --primary-light: #1e3a8a;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --bg-body: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --border: #334155;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s ease, color 0.3s ease;
}

.sme-section { padding: 40px 20px 60px; min-height: 100vh; }
.sme-container { max-width: 1280px; margin: auto; }

/* HEADER & THEME TOGGLE */
.header-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 32px;
}

.header { text-align: left; }
.header h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.025em; color: var(--text-main); }
.header p { color: var(--text-muted); font-size: 15px; margin-top: 4px; }

.theme-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
}
.theme-toggle:hover { background: var(--border); transform: rotate(15deg); }

/* SEARCH AREA */
.search-area {
    display: flex; gap: 12px; max-width: 700px; margin: 0 auto 20px;
}
.search-box {
    position: relative; flex: 1;
}
.search-box input {
    width: 100%; height: 52px; padding: 0 40px 0 48px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-input); color: var(--text-main);
    font-size: 15px; font-family: inherit; outline: none;
    transition: all 0.2s ease; box-shadow: var(--shadow-sm);
}
.search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--text-muted); pointer-events: none;
}
.clear-search {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: var(--border); border: none; color: var(--text-muted);
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    display: none; align-items: center; justify-content: center; font-size: 14px;
}
.clear-search.visible { display: flex; }
.clear-search:hover { background: var(--text-muted); color: white; }

.location-btn {
    height: 52px; padding: 0 24px; border: 0; border-radius: var(--radius);
    background: var(--primary); color: white; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s ease; box-shadow: var(--shadow-md);
}
.location-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

/* CATEGORY CHIPS */
.category-filters {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 16px;
    max-width: 700px; margin: 0 auto 24px;
    scrollbar-width: none; /* Firefox */
}
.category-filters::-webkit-scrollbar { display: none; }

.chip {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-muted); font-size: 13px;
    font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: all 0.2s ease; flex-shrink: 0;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active {
    background: var(--primary); color: white; border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

/* LAYOUT */
.layout {
    display: grid; grid-template-columns: 400px 1fr; gap: 24px; align-items: start;
}

/* SHOP LIST */
.shop-list {
    background: var(--bg-card); border-radius: var(--radius); padding: 20px;
    height: 650px; overflow-y: auto; box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
}
.shop-list::-webkit-scrollbar { width: 6px; }
.shop-list::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 20px; }

.shop-card {
    padding: 16px; margin-bottom: 12px; border: 1px solid var(--border);
    border-radius: 12px; cursor: pointer; transition: all 0.2s ease;
    background: var(--bg-card); position: relative; overflow: hidden;
    animation: fadeIn 0.3s ease-out forwards;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.shop-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--primary); opacity: 0; transition: opacity 0.2s ease;
}
.shop-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.shop-card:hover::before, .shop-card.active::before { opacity: 1; }
.shop-card.active { border-color: var(--primary); background: var(--primary-light); }

.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.shop-card h3 { font-size: 15px; font-weight: 600; color: var(--text-main); margin: 0; }
.rating { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--warning); }

.status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
    margin-bottom: 8px;
}
.status-badge.open { background: rgba(16, 185, 129, 0.1); color: var(--success); }
.status-badge.closed { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
.status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.category-tag {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--primary); background: var(--primary-light);
    padding: 4px 8px; border-radius: 6px; margin-bottom: 8px;
}

.address { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 6px; }
.address::before { content: '📍'; font-size: 12px; flex-shrink: 0; }

.card-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.action-btn {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-main); font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.2s; text-decoration: none;
}
.action-btn:hover { background: var(--border); }
.action-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.action-btn.primary:hover { background: var(--primary-hover); }

/* MAP */
.map-wrapper {
    background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow-md); border: 1px solid var(--border);
    position: sticky; top: 20px;
}
#map { width: 100%; height: 650px; z-index: 1; }

/* Custom User Marker */
.custom-user-marker { background: transparent; border: none; }
.user-pulse {
    width: 16px; height: 16px; background: var(--primary); border-radius: 50%;
    border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    position: relative;
}
.user-pulse::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 40px; height: 40px; background: rgba(37, 99, 235, 0.2); border-radius: 50%;
    animation: pulse 2s infinite;
}
@keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

/* LEAFLET POPUP CUSTOMIZATION */
.leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: var(--shadow-lg); padding: 0; border: 1px solid var(--border); background: var(--bg-card); }
.leaflet-popup-content { margin: 0; width: 240px !important; font-family: 'Inter', sans-serif; color: var(--text-main); }
.leaflet-popup-tip { background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
.leaflet-container a.leaflet-popup-close-button { color: var(--text-muted); padding: 8px 8px 0 0; font-size: 20px; }
.popup { padding: 16px; }
.popup h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.popup p { margin: 4px 0; font-size: 13px; color: var(--text-muted); }
.direction-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 12px; padding: 10px; background: var(--primary); color: white;
    text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    transition: background 0.2s; width: 100%; text-align: center;
}
.direction-btn:hover { background: var(--primary-hover); }

/* TOAST NOTIFICATION */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
    background: var(--bg-card); color: var(--text-main); padding: 14px 20px;
    border-radius: 10px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);
    font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px;
    animation: slideIn 0.3s ease-out forwards; min-width: 280px;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast.success { border-left: 4px solid var(--success); }
.toast.error { border-left: 4px solid var(--danger); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

/* MOBILE RESPONSIVENESS */
@media (max-width: 900px) {
    .sme-section { padding: 20px 16px; }
    .header-wrapper { flex-direction: column; gap: 16px; }
    .header { text-align: center; width: 100%; }
    .theme-toggle { position: absolute; top: 20px; right: 16px; }
    .search-area { flex-direction: column; }
    .location-btn { width: 100%; }
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .shop-list { height: 450px; order: 2; }
    .map-wrapper { position: relative; top: 0; order: 1; }
    #map { height: 400px; }
}
</style>
</head>

<body>

<section class="sme-section">
    <div class="sme-container">
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
        
        <div class="header-wrapper">
            <div class="header">
                <h2>SME Shop Network</h2>
                <p>Discover and support local businesses near you</p>
            </div>
        </div>

        <!-- SEARCH + LOCATION -->
        <div class="search-area">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="Search shop, category, or location..." autocomplete="off">
                <button class="clear-search" id="clearSearch" onclick="clearSearch()">✕</button>
            </div>
            <button class="location-btn" onclick="findNearby()">
                📍 Use My Location
            </button>
        </div>

        <button id="installBtn" style="display:none;">
    📲 Install App
</button>

<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;

    document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;

    deferredPrompt.prompt();

    const result = await deferredPrompt.userChoice;
    console.log(result.outcome);

    deferredPrompt = null;
    document.getElementById("installBtn").style.display = "none";
});
</script>

        <!-- CATEGORY CHIPS -->
        <div class="category-filters" id="categoryFilters">
            <button class="chip active" data-category="All">All Shops</button>
            <!-- Dynamically populated -->
        </div>

        <div class="layout">
            <!-- SHOP LIST -->
            <div class="shop-list" id="shopList"></div>

            <!-- MAP -->
            <div class="map-wrapper">
                <div id="map"></div>
            </div>
        </div>
    </div>
</section>

<div class="toast-container" id="toastContainer"></div>

<!-- Leaflet & MarkerCluster JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* ==========================================
   STATE & CONFIG
========================================== */
let currentTheme = localStorage.getItem('theme') || 'light';
let activeCategory = 'All';
let userMarker = null;
let markersCluster = null;
let searchDebounceTimer;

// Enhanced mock data with ratings, status, and contact info
const shops = [
    { id: 1, name: "Bambalapitiya Fashion Hub", category: "Fashion", address: "Galle Road, Bambalapitiya", lat: 6.8918, lng: 79.8567, rating: 4.5, isOpen: true, phone: "+94112500001" },
    { id: 2, name: "Colombo Tech Solutions", category: "Electronics", address: "Duplication Road, Colombo 04", lat: 6.8915, lng: 79.8559, rating: 4.8, isOpen: true, phone: "+94112500002" },
    { id: 3, name: "Bambalapitiya Grocery Mart", category: "Grocery", address: "Waidya Road, Bambalapitiya", lat: 6.8896, lng: 79.8582, rating: 4.2, isOpen: true, phone: "+94112500003" },
    { id: 4, name: "Marine Drive Cafe", category: "Cafe & Restaurant", address: "Marine Drive, Colombo 04", lat: 6.8964, lng: 79.8506, rating: 4.7, isOpen: true, phone: "+94112500004" },
    { id: 5, name: "Colombo Mobile Center", category: "Electronics", address: "Galle Road, Colombo 04", lat: 6.8942, lng: 79.8575, rating: 4.1, isOpen: false, phone: "+94112500005" },
    { id: 6, name: "Bambalapitiya Pharmacy", category: "Pharmacy", address: "R. A. De Mel Mawatha", lat: 6.8885, lng: 79.8568, rating: 4.6, isOpen: true, phone: "+94112500006" },
    { id: 7, name: "Duplication Road Bakery", category: "Food & Bakery", address: "Duplication Road, Colombo 04", lat: 6.8875, lng: 79.8550, rating: 4.9, isOpen: true, phone: "+94112500007" },
    { id: 8, name: "Bambalapitiya Book Store", category: "Books & Stationery", address: "Galle Road, Colombo 04", lat: 6.8952, lng: 79.8587, rating: 4.4, isOpen: false, phone: "+94112500008" },
    { id: 9, name: "Colombo Home Supplies", category: "Home & Hardware", address: "Kollupitiya Road", lat: 6.9000, lng: 79.8535, rating: 4.3, isOpen: true, phone: "+94112500009" },
    { id: 10, name: "Bambalapitiya Beauty Studio", category: "Beauty & Salon", address: "Milagiriya Avenue, Colombo 04", lat: 6.8898, lng: 79.8620, rating: 4.8, isOpen: true, phone: "+94112500010" }
];

/* ==========================================
   INITIALIZATION
========================================== */
document.addEventListener('DOMContentLoaded', () => {
    applyTheme();
    initMap();
    renderCategoryChips();
    displayShops(shops);
    setupSearch();
});

/* ==========================================
   MAP SETUP
========================================== */
let map, tileLayer;

function initMap() {
    map = L.map("map").setView([6.8947, 79.8560], 14);
    
    // Marker Cluster Group
    markersCluster = L.markerClusterGroup({
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false
    });

    updateMapTiles();
    
    shops.forEach(shop => {
        const marker = L.marker([shop.lat, shop.lng]);
        marker.bindPopup(`
            <div class="popup">
                <h3>${shop.name}</h3>
                <p>⭐ ${shop.rating} • ${shop.isOpen ? '🟢 Open' : '🔴 Closed'}</p>
                <p>📍 ${shop.address}</p>
                <a class="direction-btn" href="https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}" target="_blank">
                    🧭 Get Directions
                </a>
            </div>
        `);
        markersCluster.addLayer(marker);
        shop.marker = marker; // Reference for clicking
    });

    map.addLayer(markersCluster);
}

function updateMapTiles() {
    if (tileLayer) map.removeLayer(tileLayer);
    
    const isDark = currentTheme === 'dark';
    const tileUrl = isDark 
        ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
        : "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";
        
    const attribution = isDark 
        ? '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
        : '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

    tileLayer = L.tileLayer(tileUrl, { attribution, maxZoom: 19 }).addTo(map);
}

/* ==========================================
   THEME MANAGEMENT
========================================== */
function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', currentTheme);
    applyTheme();
    updateMapTiles();
    showToast(`Switched to ${currentTheme} mode`, 'success');
}

function applyTheme() {
    document.documentElement.setAttribute('data-theme', currentTheme);
    document.querySelector('.theme-toggle').textContent = currentTheme === 'dark' ? '☀️' : '🌙';
}

/* ==========================================
   CATEGORY CHIPS
========================================== */
function renderCategoryChips() {
    const categories = ['All', ...new Set(shops.map(s => s.category))];
    const container = document.getElementById('categoryFilters');
    
    // Keep the "All" button, remove others to rebuild
    container.innerHTML = '<button class="chip active" data-category="All">All Shops</button>';
    
    categories.slice(1).forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.dataset.category = cat;
        btn.textContent = cat;
        btn.onclick = () => filterByCategory(cat, btn);
        container.appendChild(btn);
    });
}

function filterByCategory(category, btnElement) {
    activeCategory = category;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btnElement.classList.add('active');
    applyFilters();
}

/* ==========================================
   SEARCH & FILTERING
========================================== */
function setupSearch() {
    const searchInput = document.getElementById('search');
    const clearBtn = document.getElementById('clearSearch');

    searchInput.addEventListener('input', (e) => {
        clearBtn.classList.toggle('visible', e.target.value.length > 0);
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(applyFilters, 250); // Debounce for performance
    });
}

function clearSearch() {
    const input = document.getElementById('search');
    input.value = '';
    document.getElementById('clearSearch').classList.remove('visible');
    applyFilters();
    input.focus();
}

function applyFilters() {
    const keyword = document.getElementById('search').value.toLowerCase().trim();
    
    const filtered = shops.filter(shop => {
        const matchesCategory = activeCategory === 'All' || shop.category === activeCategory;
        const matchesSearch = !keyword || 
            shop.name.toLowerCase().includes(keyword) || 
            shop.category.toLowerCase().includes(keyword) || 
            shop.address.toLowerCase().includes(keyword);
        return matchesCategory && matchesSearch;
    });

    displayShops(filtered);
}

/* ==========================================
   DISPLAY SHOPS
========================================== */
function displayShops(data) {
    const list = document.getElementById("shopList");
    list.innerHTML = "";

    if (data.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <h3>No shops found</h3>
                <p>Try adjusting your search or category filter.</p>
            </div>`;
        markersCluster.clearLayers(); // Clear map too
        return;
    }

    // Re-add only filtered markers to cluster
    markersCluster.clearLayers();
    
    data.forEach((shop, index) => {
        const card = document.createElement("div");
        card.className = "shop-card";
        card.style.animationDelay = `${index * 0.05}s`;
        
        const statusClass = shop.isOpen ? 'open' : 'closed';
        const statusText = shop.isOpen ? 'Open Now' : 'Closed';

        card.innerHTML = `
            <div class="card-header">
                <h3>${shop.name}</h3>
                <div class="rating">⭐ ${shop.rating}</div>
            </div>
            <div class="status-badge ${statusClass}">${statusText}</div>
            <div class="category-tag">${shop.category}</div>
            <div class="address">${shop.address}</div>
            ${shop.distance !== undefined ? `<div style="font-size:12px; color:var(--primary); font-weight:600; margin-bottom:8px;">📍 ${shop.distance.toFixed(2)} km away</div>` : ''}
            
            <div class="card-actions">
                <a href="tel:${shop.phone}" class="action-btn">📞 Call</a>
                <button class="action-btn primary" onclick="focusShop(${shop.id}, event)">🗺️ View on Map</button>
            </div>
        `;

        list.appendChild(card);
        markersCluster.addLayer(shop.marker);
    });
}

// Global function for the button onclick
window.focusShop = function(shopId, event) {
    event.stopPropagation(); // Prevent card click trigger
    const shop = shops.find(s => s.id === shopId);
    if (!shop) return;

    // Highlight card
    document.querySelectorAll(".shop-card").forEach(c => c.classList.remove("active"));
    event.target.closest('.shop-card').classList.add("active");

    // Fly to map
    map.flyTo([shop.lat, shop.lng], 17, { duration: 1.2 });
    shop.marker.openPopup();
};

/* ==========================================
   GEOLOCATION
========================================== */
function findNearby() {
    if (!navigator.geolocation) {
        showToast("Geolocation is not supported by your browser.", "error");
        return;
    }

    showToast("📡 Getting your location...", "success");

    navigator.geolocation.getCurrentPosition(
        (position) => {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;

            if (userMarker) map.removeLayer(userMarker);

            const userIcon = L.divIcon({
                className: 'custom-user-marker',
                html: '<div class="user-pulse"></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            userMarker = L.marker([userLat, userLng], { icon: userIcon, zIndexOffset: 1000 })
                .addTo(map)
                .bindPopup("<strong>📍 You are here</strong>");
            
            userMarker.openPopup();

            // Calculate distances
            const nearby = shops.map(shop => ({
                ...shop,
                distance: distanceKm(userLat, userLng, shop.lat, shop.lng)
            }));

            nearby.sort((a, b) => a.distance - b.distance);
            displayShops(nearby);

            map.flyTo([userLat, userLng], 14, { duration: 1.2 });
            showToast("✅ Showing nearest shops to your location", "success");
        },
        (error) => {
            let msg = "Unable to get your location.";
            if (error.code === 1) msg = "⚠️ Location permission denied. Please enable it in your browser settings.";
            else if (error.code === 2) msg = "⚠️ Location unavailable. Check your device GPS.";
            showToast(msg, "error");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

/* ==========================================
   UTILITIES
========================================== */
function distanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> ${message}`;
    
    container.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 4000);
}
</script>
